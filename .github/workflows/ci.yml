name: CI

on:
  pull_request:
    branches: [main, bot]
  push:
    branches: [bot]

permissions:
  contents: read

jobs:
  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowland-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: snowland-frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowland-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: snowland-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowland
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: snowland/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test --settings=snowland.test_settings
        env:
          DJANGO_SECRET_KEY: ci-dummy-secret-not-for-prod
