name: CI

on:
  pull_request:
    branches: [main, bot]
  push:
    branches: [bot]

permissions:
  contents: read

jobs:
  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowland-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: snowland-frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowland-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: snowland-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowland
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: snowland/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test --settings=snowland.test_settings
        env:
          DJANGO_SECRET_KEY: ci-dummy-secret-not-for-prod

  backend-mysql:
    timeout-minutes: 30
    name: backend-mysql (MySQL 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowland
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: snowland_ci
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"
          --health-start-period=20s
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: snowland/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test --settings=snowland.test_settings_mysql --parallel 1
        env:
          DJANGO_SECRET_KEY: ci-dummy-secret-not-for-prod
          SNOWLAND_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
