name = "snowland-line-engineering-relay"
main = "worker.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
RELAY_WEBHOOK_URL = "https://api2.cursor.sh/automations/webhook/11c049cc-2239-51d1-8a6b-1a7ac0b32017"
MEDIA_MAX_BYTES = "52428800"
MEDIA_URL_TTL_SECONDS = "3600"

[[kv_namespaces]]
binding = "CHAT_HISTORY"
id = "4936dd68803c482099b9f76e09057be0"

# Keep this bucket private with r2.dev public access disabled.
# Configure a bucket-wide lifecycle rule to expire objects after 2 days.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "snowland-line-relay-media"
